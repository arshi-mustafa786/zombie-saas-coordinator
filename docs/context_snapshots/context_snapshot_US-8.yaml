    function: snake_case
  libraries:
    http: httpx
    data_validation: pydantic
    llm: vertexai / google-genai
    cloud: google-cloud-firestore, google-cloud-logging

constitution:
  language: python
  linter: ruff
  max_public_methods: 7
  min_cyclomatic_complexity_per_method: 4
  test_coverage_target: 85
