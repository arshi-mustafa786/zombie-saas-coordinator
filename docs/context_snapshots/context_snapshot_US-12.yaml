story_id: US-12
story_title: "Fail-Safe Quarantine and Disposal"
techspec_file: docs/techspecs/TS-12.md
complexity: M
layers: [service, db, api]
agent: root orchestrator (zombie_saas_coordinator)
framework: google-adk

ancestor_interfaces:
  - story_id: US-5
    module: zombie_saas_coordinator/shared/approvals/approvals.py
    status: DONE
    functions:
      - "check_approval_status(proposal_id, required_gate)"
      - "revoke_approval(proposal_id, revoker_info, reason)"
    models:
      - "ApprovalGateType, ApprovalRecord"
  - story_id: US-11
    module: zombie_saas_coordinator/shared/quarantine/migration_stub.py
    status: WIP_DUMMY
    note: "US-11 is currently WIP; provided stub handles migration manifest and exception reporting."
    functions:
      - "get_migration_status(proposal_id)"
      - "get_unresolved_exceptions(proposal_id)"

exposed_interfaces:
  models:
    - "QuarantineRecord, QuarantineStatus, DisposalSignature, ValidationExceptionItem, DisposalCertificate"
  service:
    module: zombie_saas_coordinator/shared/quarantine/service.py
    functions:
      - "quarantine_source_data(proposal_id, source_metadata, retention_days)"
      - "set_legal_hold(proposal_id, operator_info, legal_hold, reason)"
      - "check_disposal_eligibility(proposal_id)"
      - "submit_disposal_signature(proposal_id, signer_info, notes)"
      - "execute_verifiable_disposal(proposal_id, executor_info)"
      - "get_quarantine_record(proposal_id)"
      - "resolve_validation_exception(proposal_id, exception_id, resolution_notes, resolved_by)"
  api_endpoints:
    module: zombie_saas_coordinator/api/quarantine.py
    routes:
      - "POST /api/v1/quarantine/{proposal_id}/quarantine"
      - "GET  /api/v1/quarantine/{proposal_id}"
      - "POST /api/v1/quarantine/{proposal_id}/legal-hold"
      - "POST /api/v1/quarantine/{proposal_id}/disposal/sign"
      - "POST /api/v1/quarantine/{proposal_id}/disposal/execute"
      - "POST /api/v1/quarantine/{proposal_id}/exceptions/{exception_id}/resolve"
  agent_tools:
    module: zombie_saas_coordinator/agent.py
    tools:
      - "check_disposal_eligibility(proposal_id)"
      - "execute_source_disposal(proposal_id, executor_uid)"

codebase_context:
  naming_conventions:
    module: snake_case
    class: PascalCase
    function: snake_case
  libraries:
    http: httpx
    data_validation: pydantic
    cloud: google-cloud-firestore, google-cloud-logging, sqlalchemy

constitution:
  language: python
  linter: ruff
  max_public_methods: 7
  min_cyclomatic_complexity_per_method: 4
  test_coverage_target: 85
