story_id: US-6
story_title: "Behavioral Contract Extraction"
techspec_file: docs/techspecs/TS-6.md
complexity: L
layers: [service, api, db]
agent: architect_agent
framework: google-adk

ancestor_interfaces:
  - story_id: US-5
    module: zombie_saas_coordinator/shared/approvals/approvals.py
    status: DONE
    functions:
      - "check_approval_status(proposal_id, required_gate='PERMISSION_TO_INVESTIGATE')"
    notes: "US-6 fails closed (GATE_ERROR) if the approval check raises."
  - story_id: US-3
    module: zombie_saas_coordinator/shared/models/proposal.py
    status: DONE
    models:
      - "ConsolidationProposal"

exposed_interfaces:
  agent_tools:
    - "extract_trello_rules(proposal_id, board_id, butler_rules=None)"
    - "parse_automation_rule(raw_rule)"
  firestore_collections:
    - "behavioral_contracts (ContractExtraction, immutable, read by US-7)"
  audit_logs:
    - "behavioral-contract-audit"
  models:
    - "zombie_saas_coordinator/shared/models/contract.py: BehavioralContract, BoardSnapshot, ContractExtraction"

codebase_context:
  naming_conventions:
    module: snake_case
    class: PascalCase
    function: snake_case
  libraries:
    http: httpx
    data_validation: pydantic
    llm: google-genai (via shared/llm.py)
    cloud: google-cloud-firestore, google-cloud-logging, google-cloud-secret-manager
  shared_modules_added:
    - "shared/integrations/trello.py"
    - "shared/llm.py (prompt_safe, gemini_generate; also used by US-3)"

constitution:
  language: python
  linter: ruff
  max_public_methods: 7
  min_cyclomatic_complexity_per_method: 4
  test_coverage_target: 85
